<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ProjectH</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
</head>
<body>
  <!-- ===== ヘッダー / ツールバー ===== -->
  <header>
    <!-- 表示切替バー -->
    <div class="view-toggle-bar">
      <button class="view-toggle active" type="button" data-target="toolbar-main" title="ツールバー">Tool</button>
      <button class="view-toggle active" type="button" data-target="railWrap" title="サムネイル">Thumbnail</button>
      <button class="view-toggle active" type="button" data-target="objectPanel" title="OBJECTSパネル">OBJ</button>
      <button class="view-toggle active" type="button" data-target="panelLayers" title="LAYERSパネル">LAYER</button>
      <button class="view-toggle active" type="button" data-target="panelCode" title="Code Spaceパネル">CODE</button>
      <button class="view-toggle active" type="button" data-target="appFooter" title="操作説明">Usage</button>
    </div>

    <div class="toolbar" id="toolbar-main">
      <div class="row">
        <label class="font-label">
          TextSize
          <input id="fontSize" type="number" min="12" max="200" value="64" />
          <span>px</span>
        </label>
        <button id="rasterize">Rasterize</button>
        <button id="backToText">backToText</button>
        <span id="counter" class="page-counter"></span>
      </div>
      <div class="row">
        <button id="addOne">AddPage</button>
        <button id="duplicate">Duplicate Page</button>
        <button id="delete">DeletePage</button>
        <button id="prev">◀ Previous</button>
        <button id="next">Next ▶</button>
        <button id="export">Save File</button>
        <button id="import">Import</button>
        <button id="exportImage">SaveAsPNG</button>
        <button id="exportAllImages">SaveAll</button>
        <input id="importFile" type="file" accept=".kmshb,.json" style="display:none" />
      </div>
    </div>
  </header>

  <!-- 表に出さないテキストエディタ（既存ロジック保持用） -->
  <textarea id="editor" style="position:absolute; left:-9999px; top:-9999px;"></textarea>

  <!-- ===== メインコンテンツ（ステージ＋右サイドバー） ===== -->
  <div class="content-wrap">
    <main>
      <div class="stage">
        <!-- ズーム／パン変換はこの内部レイヤーに適用 -->
        <div id="stageInner" class="stage-inner">
          <div id="output" class="text">文字を視る</div>
          <div class="badge" id="badge">01</div>
          <!-- ラスタライズレイヤーと手書きキャンバスは JS で追加 -->
        </div>
      </div>
    </main>

    <!-- ===== サムネイル（右サイドバー） ===== -->
    <div class="railWrap" id="railWrap">
      <div id="rail" class="rail" aria-label="ページ一覧"></div>
    </div>
  </div>

  <!-- ===== OBJECT パネル（左） ===== -->
  <aside id="objectPanel" class="object-panel">
    <div class="panel-drag-handle">OBJECTS</div>

    <!-- 図形 / テキストツール -->
    <div class="object-panel-section">
      <div class="object-panel-title">TOOLS</div>
      <div class="object-tool-row">
        <button id="shapeCircleFill" class="object-tool-btn" type="button">●</button>
        <button id="shapeCircleRing" class="object-tool-btn" type="button">○</button>
        <button id="shapeTriangle" class="object-tool-btn" type="button">▲</button>
        <button id="shapeSquare" class="object-tool-btn" type="button">■</button>
        <button id="shapeFullRect" class="object-tool-btn" type="button">▭</button>
      </div>
      <div class="object-tool-row">
        <button id="toolTextBtn" class="object-tool-btn" type="button">T</button>
        <input
          id="toolTextInput"
          class="object-text-input"
          type="text"
          placeholder="Text"
        />
      </div>
      <p class="object-hint">
        KeyT/KeyS
      </p>
    </div>

    <!-- カラー -->
    <div class="object-panel-section">
      <div class="object-panel-title">COLOR</div>
      <div class="color-palette">
        <button class="color-swatch active" type="button" data-color="#111111" style="background:#111111;"></button>
        <button class="color-swatch" type="button" data-color="#e53935" style="background:#e53935;"></button>
        <button class="color-swatch" type="button" data-color="#1e88e5" style="background:#1e88e5;"></button>
        <button class="color-swatch" type="button" data-color="#fdd835" style="background:#fdd835;"></button>
        <button class="color-swatch" type="button" data-color="#8e24aa" style="background:#8e24aa;"></button>
        <button class="color-swatch" type="button" data-color="#43a047" style="background:#43a047;"></button>
        <button class="color-swatch" type="button" data-color="#ffffff" style="background:#ffffff;"></button>
      </div>
      <div class="color-custom-row">
        <span>Custom</span>
        <input id="customColor" type="color" value="#111111" />
      </div>
    </div>

    <!-- DRAW（手書きモード） -->
    <div class="object-panel-section">
      <div class="object-panel-title">DRAW</div>
      <label class="draw-toggle">
        <input type="checkbox" id="drawModeToggle" />
        <span>WritingMode</span>
      </label>
      
    </div>

    <!-- SNAP -->
    <div class="object-panel-section">
      <div class="object-panel-title">SNAP</div>
      <label class="snap-toggle">
        <input type="checkbox" id="snapCenterToggle" />
        <span>Snap</span>
      </label>
      
    </div>

    <!-- ESSAY -->
    <div class="object-panel-section">
      <div class="object-panel-title">ESSAY</div>
      <div class="essay-size-row">
        <label class="essay-size-label">
          行
          <input id="essayRowsInput" type="number" min="5" max="50" value="50" class="essay-size-input" />
        </label>
        <label class="essay-size-label">
          列
          <input id="essayColsInput" type="number" min="5" max="50" value="30" class="essay-size-input" />
        </label>
      </div>
      <button id="essayModeBtn" class="essay-open-btn" type="button">Essay</button>
      <p class="object-hint">
        Shift+E/ Esc<br />
      </p>
    </div>
  </aside>
  <!-- ===== レイヤーパネル（右上） ===== -->
  <aside id="panelLayers" class="layers-panel">
    <div class="panel-drag-handle">LAYERS</div>
    <ul id="layerList" class="layer-list"></ul>
  </aside>

  <!-- ===== P5エディタ パネル（右下） ===== -->
  <aside id="panelCode" class="code-panel">
    <div class="panel-drag-handle">Code Space</div>
    <textarea id="canvasCode" class="code-textarea" spellcheck="false"></textarea>
    <div id="codeErrorMsg" class="code-error-msg"></div>
    <div id="codePreviewArea" class="code-preview-area">
      <img id="codePreviewImg" class="code-preview-img" alt="Preview" />
    </div>
    <div class="code-btn-row">
      <button id="previewCode" class="generate-code-btn" type="button">Preview</button>
      <button id="generateCode" class="generate-code-btn" type="button">Generate</button>
      <button id="copyCode" class="copy-code-btn" type="button">Copy</button>
    </div>
  </aside>

  <!-- 画像挿入用（ダブルクリック時に開く） -->
  <input id="imageFile" type="file" accept="image/*" style="display:none" />

  <footer id="appFooter"> 
    <strong>Fでページだけフルスクリーン</strong> /
    <strong>Shift+E でエッセイモード（原稿用紙）</strong> /
    <strong>Shift+スクロールでズーム / 中ボタン長押しでパン</strong> /
    Sでサイズ編集モード / Ctrl+Z / Ctrl+Shift+Z でUndo/Redo
  </footer>

  <!-- ===== エッセイモード オーバーレイ ===== -->
  <div id="essayOverlay" class="essay-hidden">
    <canvas id="essayCanvas"></canvas>
    <textarea id="essayHiddenInput" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
  </div>

  <!-- JS: 依存順にロード（グローバルスコープ共有） -->
  <script src="js/constants.js"></script>
  <script src="js/state.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/render.js"></script>
  <script src="js/slides.js"></script>
  <script src="js/objects.js"></script>
  <script src="js/draw.js"></script>
  <script src="js/export.js"></script>
  <script src="js/essay.js"></script>
  <script src="js/codespace.js"></script>
  <script src="js/events.js"></script>
</body>
</html>
